name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Test
        run: swift test
      - name: Build the app
        run: VERSION="$TAG" scripts/make-app.sh
      - name: Package
        run: |
          ditto -c -k --keepParent .build/TranslateMac.app TranslateMac.zip
          shasum -a 256 TranslateMac.zip > TranslateMac.zip.sha256
          awk -v version="${TAG#v}" '$0 ~ "^## \\[" version "\\]" {found=1; next} /^## \[/ {found=0} found' CHANGELOG.md > release-notes.md
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: TranslateMac.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" TranslateMac.zip TranslateMac.zip.sha256
          --verify-tag --title "TranslateMac $TAG" --notes-file release-notes.md
