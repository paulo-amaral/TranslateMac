name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected and what you saw. Do not paste private text you translated.
    validations:
      required: true
  - type: input
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    attributes:
      label: TranslateMac version
    validations:
      required: true
  - type: input
    attributes:
      label: Language pair
      description: For example Portuguese to English
