name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  # Runs the repository's own code, so it holds no write or identity permission.
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Test
        run: swift test
      - name: Build the app
        run: VERSION="$TAG" scripts/make-app.sh
      - name: Package
        run: |
          ditto -c -k --keepParent .build/TranslateMac.app TranslateMac.zip
          shasum -a 256 TranslateMac.zip > TranslateMac.zip.sha256
          # Compare the header as a literal string: a dot in the version must not act as a wildcard.
          awk -v header="## [${TAG#v}]" '$0 == header {found=1; next} /^## \[/ {found=0} found' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for ${TAG#v}" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            TranslateMac.zip
            TranslateMac.zip.sha256
            release-notes.md
          if-no-files-found: error
          retention-days: 1

  # Runs no repository code: it only attests and publishes what the build job produced.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Check the archive against its checksum
        run: shasum -a 256 -c TranslateMac.zip.sha256
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: TranslateMac.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "$TAG" TranslateMac.zip TranslateMac.zip.sha256
          --verify-tag --title "TranslateMac $TAG" --notes-file release-notes.md
